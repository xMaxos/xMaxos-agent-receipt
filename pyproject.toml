[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-receipt"
version = "0.2.0"
description = "Durable, conservative receipts for side-effecting agent tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/xMaxos/xMaxos-agent-receipt"
Issues = "https://github.com/xMaxos/xMaxos-agent-receipt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_receipt = ["py.typed"]
